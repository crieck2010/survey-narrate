[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-narrate"
version = "0.1.0"
description = "Data-rich narrative captions for wind/current fields: story facts + mapped.earth-style captions. Pure-Python engine, no UI imports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Charles Rieck" }]
keywords = ["geospatial", "wind", "currents", "narrative", "captions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/crieck2010/survey-narrate"
Repository = "https://github.com/crieck2010/survey-narrate"

[tool.setuptools.packages.find]
where = ["src"]
